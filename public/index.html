<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Cardinal Personal</title>
<link rel="manifest" href="/manifest.json" />
<link rel="icon" href="/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/icon.svg" />
<meta name="theme-color" content="#0a0b0e" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

  :root {
    --bg: #08090b;
    --panel: #101216;
    --panel-2: #16181d;
    --border: #232630;
    --border-soft: #1a1c22;
    --text: #f2f3f5;
    --dim: #8b8f99;
    --dim-2: #5c6068;
    --accent: #e0343f;
    --accent-2: #ff5a63;
    --accent-glow: rgba(224, 52, 63, 0.28);
    --green: #34d399;
    --gold: #d4af37;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, rgba(224,52,63,0.10), transparent 60%),
      var(--bg);
    color: var(--text);
    font: 15px/1.5 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    min-height: 100vh;
    margin: 0;
    padding: 64px 24px 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .shell { width: 100%; max-width: 460px; }

  /* ---- Brand ---- */
  .brand { display: flex; flex-direction: column; align-items: center; margin-bottom: 44px; }
  .brand .mark {
    width: 44px; height: 44px; border-radius: 13px; margin-bottom: 16px;
    background: linear-gradient(160deg, var(--accent-2), #8f1116 85%);
    box-shadow: 0 8px 28px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,0.18);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
  }
  .brand h1 {
    font-size: 15px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase;
    margin: 0 0 6px; color: #fff;
  }
  .brand p { font-size: 13px; color: var(--dim-2); margin: 0; letter-spacing: 0.01em; }

  /* ---- Stepper ---- */
  .stepper { display: flex; align-items: flex-start; justify-content: center; margin-bottom: 40px; }
  .step-node { display: flex; flex-direction: column; align-items: center; width: 84px; position: relative; }
  .step-circle {
    width: 30px; height: 30px; border-radius: 50%;
    background: var(--panel); border: 1.5px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700; color: var(--dim-2);
    transition: all .35s cubic-bezier(.4,0,.2,1); z-index: 1;
  }
  .step-label {
    font-size: 10.5px; margin-top: 9px; color: var(--dim-2);
    letter-spacing: 0.03em; text-align: center; font-weight: 600;
    text-transform: uppercase; transition: color .3s;
  }
  .step-line {
    position: absolute; top: 15px; left: -42px; width: 84px; height: 1.5px;
    background: var(--border); z-index: 0;
  }
  .step-node:first-child .step-line { display: none; }
  .step-node.done .step-circle { background: var(--green); border-color: var(--green); color: #06120c; box-shadow: 0 0 14px rgba(52,211,153,0.35); }
  .step-node.done .step-label { color: var(--dim); }
  .step-node.done .step-line { background: var(--green); }
  .step-node.active .step-circle { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 0 0 4px var(--accent-glow); }
  .step-node.active .step-label { color: var(--text); }

  /* ---- Stage card ---- */
  .stage {
    background: linear-gradient(180deg, var(--panel), #0d0f13);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 36px 32px;
    box-shadow: 0 24px 60px -20px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.03);
    animation: rise .4s cubic-bezier(.16,1,.3,1);
  }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent-2); margin: 0 0 10px; }
  .stage h2 { font-size: 21px; font-weight: 700; margin: 0 0 10px; letter-spacing: -0.01em; }
  .stage .desc { color: var(--dim); font-size: 13.5px; line-height: 1.6; margin: 0 0 26px; }

  input {
    display: block; width: 100%; margin-bottom: 10px;
    padding: 13px 14px; font-size: 14px; font-family: inherit;
    background: #0a0b0e; border: 1px solid var(--border);
    border-radius: 10px; color: var(--text); outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
  input::placeholder { color: var(--dim-2); }

  .btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; padding: 14px 18px; font-size: 14.5px; font-weight: 650; font-family: inherit;
    border-radius: 11px; border: none; cursor: pointer; text-decoration: none;
    transition: transform .12s, filter .15s, box-shadow .2s;
    background: linear-gradient(160deg, var(--accent-2), var(--accent) 70%);
    color: #fff; box-shadow: 0 10px 24px -8px var(--accent-glow);
    margin-bottom: 10px;
  }
  .btn:hover { filter: brightness(1.07); }
  .btn:active { transform: scale(0.985); }
  .btn:disabled { opacity: 0.55; cursor: default; filter: none; }
  .btn.secondary {
    background: var(--panel-2); box-shadow: none; border: 1px solid var(--border); color: var(--text);
  }
  .btn.secondary:hover { border-color: #33373f; }
  .link-row { text-align: center; margin-top: 4px; }
  .link-row a, .link-row span.link {
    font-size: 12.5px; color: var(--dim); cursor: pointer; text-decoration: none; border-bottom: 1px solid transparent;
  }
  .link-row a:hover, .link-row span.link:hover { color: var(--text); border-color: var(--dim); }

  .spinner {
    width: 14px; height: 14px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.35); border-top-color: #fff;
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .banner {
    font-size: 13px; padding: 12px 14px; border-radius: 10px; margin-bottom: 18px;
    border: 1px solid; display: none;
  }
  .banner.error { background: rgba(224,52,63,0.08); border-color: rgba(224,52,63,0.35); color: #ff9299; }
  .banner.info { background: rgba(52,211,153,0.08); border-color: rgba(52,211,153,0.3); color: #7fe8bf; }

  .safety {
    display: flex; align-items: center; gap: 8px; margin-top: 22px;
    padding: 12px 14px; background: rgba(212,175,55,0.06); border: 1px solid rgba(212,175,55,0.2);
    border-radius: 10px; font-size: 12px; color: #d9c88a; line-height: 1.5;
  }

  /* ---- Results ---- */
  .rec-card {
    background: var(--panel-2); border: 1px solid var(--border-soft); border-radius: 12px;
    padding: 16px 18px; margin-bottom: 10px;
  }
  .rec-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .rec-agent { font-size: 12.5px; font-weight: 700; color: var(--text); }
  .pill {
    font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em;
    padding: 3px 9px; border-radius: 20px;
  }
  .pill.high { background: rgba(52,211,153,0.15); color: var(--green); }
  .pill.medium { background: rgba(212,175,55,0.15); color: var(--gold); }
  .pill.low { background: rgba(139,143,153,0.15); color: var(--dim); }
  .rec-summary { font-size: 13px; color: var(--dim); line-height: 1.55; }

  details.debug { margin-top: 28px; }
  details.debug summary { font-size: 11px; color: var(--dim-2); cursor: pointer; letter-spacing: 0.03em; }
  pre {
    background: #000; border: 1px solid var(--border); border-radius: 10px;
    padding: 14px; overflow-x: auto; white-space: pre-wrap; word-break: break-word;
    font: 11.5px/1.6 ui-monospace, "SF Mono", Menlo, monospace;
    color: #7fe8bf; max-height: 260px; overflow-y: auto; margin-top: 10px;
  }

  footer { text-align: center; color: var(--dim-2); font-size: 11.5px; margin-top: 36px; max-width: 460px; }
</style>
</head>
<body>

<div class="shell">
  <div class="brand">
    <div class="mark">🐦</div>
    <h1>Cardinal Personal</h1>
    <p>Your holdings. Your analysis. Your trades.</p>
  </div>

  <div class="stepper" id="stepper"></div>

  <div class="stage" id="stage"></div>

  <details class="debug">
    <summary>Developer output</summary>
    <pre id="out">—</pre>
  </details>
</div>

<footer>This app never places trades. Every order is placed by you, in Schwab, yourself.</footer>

<script>
const STEPS = [
  { id: 'auth',    label: 'Sign in' },
  { id: 'connect', label: 'Connect' },
  { id: 'sync',    label: 'Sync' },
];

let current = 'auth';
let busy = false;
let creds = { email: '', password: '' };
const out = document.getElementById('out');

function log(label, data) {
  out.textContent = `${label}\n` + (typeof data === 'string' ? data : JSON.stringify(data, null, 2));
}

function renderStepper() {
  const idx = STEPS.findIndex(s => s.id === current);
  document.getElementById('stepper').innerHTML = STEPS.map((s, i) => `
    <div class="step-node ${i < idx ? 'done' : i === idx ? 'active' : ''}">
      <div class="step-line"></div>
      <div class="step-circle">${i < idx ? '✓' : i + 1}</div>
      <div class="step-label">${s.label}</div>
    </div>
  `).join('');
}

function banner(msg) {
  return msg ? `<div class="banner error" style="display:block">${msg}</div>` : '';
}

function renderStage(errorMsg) {
  const stage = document.getElementById('stage');
  const spinner = '<span class="spinner"></span>';

  if (current === 'auth') {
    stage.innerHTML = `
      <p class="eyebrow">Step 1 of 3</p>
      <h2>Sign in</h2>
      <p class="desc">A local account for this app only — separate from your real Schwab login.</p>
      ${banner(errorMsg)}
      <input id="email" placeholder="email" autocomplete="username" value="${creds.email}" />
      <input id="password" type="password" placeholder="password" autocomplete="current-password" />
      <button class="btn" id="loginBtn" onclick="doAuth('/auth/login')">Log in</button>
      <button class="btn secondary" id="signupBtn" onclick="doAuth('/auth/signup')">Create account</button>
    `;
    return;
  }

  if (current === 'connect') {
    stage.innerHTML = `
      <p class="eyebrow">Step 2 of 3</p>
      <h2>Connect Schwab</h2>
      <p class="desc">You'll be taken to Schwab's real login page. This app never sees your Schwab password — Schwab hands us back a token, not your credentials.</p>
      ${banner(errorMsg)}
      <a class="btn" href="/schwab/connect">Connect Schwab →</a>
      <div class="link-row"><span class="link" onclick="signOut()">Sign out</span></div>
      <div class="safety">🔒 Read-only access. No route in this app can place, modify, or cancel a trade.</div>
    `;
    return;
  }

  if (current === 'sync') {
    stage.innerHTML = `
      <p class="eyebrow">Step 3 of 3</p>
      <h2>Sync positions</h2>
      <p class="desc">Schwab is connected. Pull your current holdings, then head into your dashboard.</p>
      ${banner(errorMsg)}
      <button class="btn" id="syncBtn" onclick="doSync()">Sync positions →</button>
    `;
    return;
  }
}

function setButtonLoading(id, loadingLabel) {
  const btn = document.getElementById(id);
  if (!btn) return;
  btn.disabled = true;
  btn.dataset.original = btn.innerHTML;
  btn.innerHTML = `<span class="spinner"></span> ${loadingLabel}`;
}

async function doAuth(path) {
  if (busy) return;
  busy = true;
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const btnId = path.endsWith('login') ? 'loginBtn' : 'signupBtn';
  setButtonLoading(btnId, path.endsWith('login') ? 'Signing in…' : 'Creating…');
  try {
    const r = await fetch(path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password }),
    });
    const j = await r.json();
    log(`POST ${path}`, j);
    if (!r.ok) { busy = false; renderStage(j.error || 'Something went wrong.'); return; }
    creds.email = email;
    await refreshState();
  } catch (e) {
    busy = false;
    renderStage('Could not reach the server: ' + e.message);
  }
  busy = false;
}

async function doSync() {
  if (busy) return;
  busy = true;
  setButtonLoading('syncBtn', 'Syncing…');
  try {
    const r = await fetch('/schwab/sync', { method: 'POST' });
    const j = await r.json();
    log('POST /schwab/sync', j);
    if (!r.ok) { busy = false; renderStage(j.error); return; }
    await refreshState();
  } catch (e) {
    busy = false;
    renderStage('Sync failed: ' + e.message);
  }
  busy = false;
}

async function signOut() {
  await fetch('/auth/logout', { method: 'POST' });
  creds = { email: '', password: '' };
  current = 'auth';
  renderStepper();
  renderStage();
}

async function refreshState() {
  try {
    const r = await fetch('/api/status');
    const j = await r.json();
    if (!j.loggedIn) { current = 'auth'; renderStepper(); renderStage(); return; }
    if (!j.schwabConnected) { current = 'connect'; renderStepper(); renderStage(); return; }
    if (!j.hasHoldings) { current = 'sync'; renderStepper(); renderStage(); return; }
    // Fully onboarded — hand off to the real dashboard.
    location.href = '/dashboard.html';
  } catch {
    renderStage('Server unreachable.');
  }
}

// If Schwab's callback just redirected us back with ?step=sync, drop the
// query param after reading it — refreshState() below determines the real
// step from actual server state either way.
if (new URLSearchParams(location.search).has('step')) {
  history.replaceState({}, '', location.pathname);
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
}

refreshState();
</script>
</body>
</html>
