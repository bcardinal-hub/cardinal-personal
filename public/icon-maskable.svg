<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c9a35c"/>
      <stop offset="100%" stop-color="#16233d"/>
    </linearGradient>
  </defs>
  <!-- Maskable variant: fills the full square edge-to-edge (no rounded
       corners, no transparent background) — the OS applies its own mask
       shape (circle, squircle, etc.) on top, so this must be a solid,
       full-bleed canvas. The bird glyph stays centered well inside the
       ~80%-diameter safe zone so it survives any mask shape uncropped. -->
  <rect width="512" height="512" fill="url(#g)"/>
  <text x="256" y="326" font-size="260" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">🐦</text>
</svg>
